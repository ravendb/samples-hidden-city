services:
  ravendb:
    # Pinned to match RAVENDB_IMAGE_TAG in versions.env and k8s/ravendb/values.yaml's
    # image: -- preflight asserts all three agree. Bump together, never just one.
    image: ravendb/ravendb:7.2.6-ubuntu.24.04-x64
    ports:
      - "8080:8080"
      - "38888:38888"
    environment:
      RAVEN_ARGS: "--Setup.Mode=None"
      RAVEN_Security_UnsecuredAccessAllowed: "PrivateNetwork"
      RAVEN_License: ${RAVENDB_LICENSE:-}
    volumes:
      - ravendb-data:/var/lib/ravendb/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/setup/alive"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ravendb-data:
