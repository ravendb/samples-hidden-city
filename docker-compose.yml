services:
  ravendb:
    image: ravendb/ravendb:latest
    ports:
      - "8080:8080"
      - "38888:38888"
    environment:
      RAVEN_ARGS: "--Setup.Mode=None"
      RAVEN_Security_UnsecuredAccessAllowed: "PrivateNetwork"
      RAVEN_License_Path: "/opt/ravendb/license.json"
    volumes:
      - ravendb-data:/var/lib/ravendb/data
      - ./license.json:/opt/ravendb/license.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alive"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ravendb-data:
