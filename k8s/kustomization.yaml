apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hidden-city

resources:
  - namespace.yaml
  - configmap.yaml
  - agent/deployment.yaml
  - agent/service.yaml
  - agent/ingress.yaml
  - scraper/cronjob.yaml
  - worker/deployment.yaml

# secrets.yaml is a template only — apply secrets.local.yaml manually:
#   cp k8s/secrets.yaml k8s/secrets.local.yaml
#   vim k8s/secrets.local.yaml          # fill in real values
#   kubectl apply -f k8s/secrets.local.yaml
#
# The RavenDB cluster itself is NOT applied via kustomize — the operator's
# RavenDBCluster CRD is deployed as a Helm chart (ravendb-operator/ravendb-cluster),
# using k8s/ravendb/values.yaml. Run k8s/operator/install.sh first, then:
#   helm upgrade --install ravendb-cluster ravendb-operator/ravendb-cluster \
#     -n hidden-city --create-namespace -f k8s/ravendb/values.yaml
