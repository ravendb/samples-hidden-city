apiVersion: v1
kind: ConfigMap
metadata:
  name: hidden-city-config
  namespace: hidden-city
data:
  # ravendb-cluster-svc = ClusterIP service the operator creates for the RavenDBCluster.
  # Switch to https://ravendb-cluster-svc:443 when tlsMode=ClusterExternalAccess.
  RAVENDB_URL: "http://ravendb-cluster-svc:8080"
  RAVENDB_DATABASE: "hidden-city"
  LLM_MODEL: "gpt-4o-mini"
  MAX_TOKENS_BUDGET: "1500"
  MAX_HUB_LOOKUPS_PER_ORIGIN: "25"
