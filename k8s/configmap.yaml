apiVersion: v1
kind: ConfigMap
metadata:
  name: hidden-city-config
  namespace: hidden-city
data:
  # ravendb-cluster-svc is a placeholder — verify the actual in-cluster Service
  # name/port the ravendb-operator/ravendb-cluster chart creates for this release
  # via `kubectl get svc -n hidden-city` once it's deployed (see k8s/ravendb/values.yaml,
  # mode: None means TLS is on, so this should likely be https://... not http).
  RAVENDB_URL: "http://ravendb-cluster-svc:8080"
  RAVENDB_DATABASE: "hidden-city"
  LLM_MODEL: "gpt-4o-mini"
  MAX_TOKENS_BUDGET: "1500"
  MAX_HUB_LOOKUPS_PER_ORIGIN: "25"
