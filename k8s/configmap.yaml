apiVersion: v1
kind: ConfigMap
metadata:
  name: hidden-city-config
  namespace: hidden-city
data:
  # The ravendb-operator chart creates one Service per node tag from
  # k8s/ravendb/values.yaml (tags a/b/c) — ravendb-a, ravendb-b, ravendb-c —
  # not a single load-balanced "-svc" name. Any one is a valid initial contact
  # point; the client discovers the rest of the topology from there. Port 443
  # is the node's HTTPS port (mode: None still means self-signed TLS, not
  # plaintext) — see RAVENDB_CLIENT_CERT_PATH/RAVENDB_CA_CERT_PATH below for
  # the client-cert auth this cluster requires on top of TLS.
  RAVENDB_URL: "https://ravendb-a:443"
  RAVENDB_DATABASE: "hidden-city"
  RAVENDB_CLIENT_CERT_PATH: "/certs/client/client.pfx"
  RAVENDB_CA_CERT_PATH: "/certs/ca/ca.crt"
  LLM_MODEL: "gpt-4o-mini"
  MAX_TOKENS_BUDGET: "1500"
