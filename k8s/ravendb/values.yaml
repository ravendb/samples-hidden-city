# Helm values for the ravendb-operator/ravendb-cluster chart
# (https://github.com/ravendb/ravendb-operator).
#
# Deploy with:
#   helm upgrade --install ravendb-cluster ravendb-operator/ravendb-cluster \
#     -n hidden-city --create-namespace -f k8s/ravendb/values.yaml
#
# This is the real RavenDBCluster CRD shape (apiVersion: ravendb.ravendb.io/v1),
# not a hand-rolled schema — verify field-for-field with
# `kubectl explain ravendbcluster.spec` once the operator is installed, since the
# chart may add/rename fields between releases.
#
# mode: None below means self-signed certs supplied via the *SecretRef fields —
# suitable for a local/kind demo with no public DNS. For a cloud demo, switch to
# mode: LetsEncrypt (needs an `email` field and a real domain instead of the
# *CertSecretRef entries) — see examples/tls/letsencrypt in the operator repo.
nodes:
  - tag: a
    publicServerUrl: https://a.hiddencity.local:443
    publicServerUrlTcp: tcp://a-tcp.hiddencity.local:443
  - tag: b
    publicServerUrl: https://b.hiddencity.local:443
    publicServerUrlTcp: tcp://b-tcp.hiddencity.local:443
  - tag: c
    publicServerUrl: https://c.hiddencity.local:443
    publicServerUrlTcp: tcp://c-tcp.hiddencity.local:443

image: ravendb/ravendb:latest
imagePullPolicy: IfNotPresent
mode: None
domain: hiddencity.local

# Created ahead of time (see k8s/operator/install.sh step 1):
#   kubectl create secret generic ravendb-license -n hidden-city --from-file=license.json=...
#   kubectl create secret tls ravendb-cert       -n hidden-city --from-file=...   # combined server cert, all node SANs
#   kubectl create secret generic ravendb-ca-cert     -n hidden-city --from-file=...
#   kubectl create secret tls ravendb-client-cert -n hidden-city --from-file=...  # ClusterAdmin client cert
licenseSecretRef: ravendb-license
clusterCertSecretRef: ravendb-cert
caCertSecretRef: ravendb-ca-cert
clientCertSecretRef: ravendb-client-cert

# nginx ingress must already be installed in the cluster; for kind, add
# a/a-tcp/b/b-tcp/c/c-tcp.hiddencity.local entries to /etc/hosts pointing at
# the ingress controller's address.
externalAccessConfiguration:
  type: ingress-controller
  ingressControllerContext:
    ingressClassName: nginx

storage:
  data:
    size: 50Gi
    storageClassName: standard  # use "local-path" on a kind cluster
