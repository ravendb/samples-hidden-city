# RavenDB 3-node cluster managed by the Operator.
#
# The Operator handles:
#   - bootstrapping and Raft cluster formation
#   - TLS certificate wiring
#   - rolling upgrades with quorum gates (never drops below (n/2)+1 nodes)
#   - continuous reconciliation against this declared state
#   - admission webhooks that reject invalid configs before apply
#
# Services created by the operator (namespace: hidden-city):
#   ravendb-cluster        — headless, used by StatefulSet pods for peer discovery
#   ravendb-cluster-svc    — ClusterIP, agent connects here (port 8080)
#   ravendb-cluster-lb     — LoadBalancer for Studio access from outside the cluster
#
# After first apply: open Studio at the LoadBalancer IP to activate your license.
apiVersion: ravendb.com/v1alpha1
kind: RavenDBCluster
metadata:
  name: ravendb-cluster
  namespace: hidden-city
spec:
  # Number of nodes. Minimum 3 for Raft quorum.
  size: 3

  # Pin to a specific version in production.
  ravenImage: ravendb/ravendb:6.0-latest

  # tlsMode options:
  #   None                  — plain HTTP on port 8080, no external LoadBalancer
  #   ClusterExternalAccess — TLS + LoadBalancer so Studio is reachable from outside
  tlsMode: ClusterExternalAccess

  storage:
    size: 50Gi
    storageClassName: standard  # replace with your cluster's StorageClass

  # License loaded from the app Secret.
  # Get a free developer license at https://ravendb.net/license/request/dev
  license:
    secretKeyRef:
      name: hidden-city-secrets
      key: RAVENDB_LICENSE

  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
