apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: hidden-city
  labels:
    app: agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
        - name: agent
          image: hidden-city:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: hidden-city-config
            - secretRef:
                name: hidden-city-secrets
          volumeMounts:
            - name: ravendb-client-cert
              mountPath: /certs/client
              readOnly: true
            - name: ravendb-ca-cert
              mountPath: /certs/ca
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: ravendb-client-cert
          secret:
            secretName: ravendb-client-cert
        - name: ravendb-ca-cert
          secret:
            secretName: ravendb-ca-cert
