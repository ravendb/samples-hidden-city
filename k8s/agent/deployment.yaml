apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: hidden-city
  labels:
    app: agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
        - name: agent
          image: hidden-city:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: hidden-city-config
            - secretRef:
                name: hidden-city-secrets
          volumeMounts:
            - name: ravendb-client-cert
              mountPath: /certs/client
              readOnly: true
            - name: ravendb-ca-cert
              mountPath: /certs/ca
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            # _startup() (app.py) runs the Travelpayouts bulk scraper synchronously
            # before uvicorn serves, one sequential API call per _FALLBACK_ORIGINS
            # entry (src/scraper/run.py) -- now ~80 national-capital airports across
            # Europe/Asia/US instead of the original 6, so cold start is easily
            # 10+ minutes. failureThreshold*periodSeconds must outlast that or
            # kubelet kills the pod mid-startup on every boot -- this is a rough
            # allowance, verify against an actual rollout and adjust if it still
            # gets killed before "Application startup complete" appears in the logs.
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 120
      volumes:
        - name: ravendb-client-cert
          secret:
            secretName: ravendb-client-cert
        - name: ravendb-ca-cert
          secret:
            secretName: ravendb-ca-cert
