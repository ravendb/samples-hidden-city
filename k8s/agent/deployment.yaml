apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: hidden-city
  labels:
    app: agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
        - name: agent
          image: hidden-city:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: hidden-city-config
            - secretRef:
                name: hidden-city-secrets
          volumeMounts:
            - name: ravendb-client-cert
              mountPath: /certs/client
              readOnly: true
            - name: ravendb-ca-cert
              mountPath: /certs/ca
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            # _startup() (app.py) no longer awaits the Travelpayouts bulk scraper --
            # it's fired as a background task (_run_scraper_background) precisely so
            # uvicorn can start answering /health without waiting on it. What's left
            # gating readiness is ensure_database's own retry budget (src/db/seed.py,
            # up to 90s if RavenDB isn't reachable yet) plus two quick API validation
            # calls (OpenAI, Travelpayouts). This budget was previously ~20 minutes,
            # sized for the scraper blocking startup -- confirmed hitting that ceiling
            # for real on a cold, 2-replica rollout (both pods scraping ~80 origins
            # concurrently). No longer needed now that the scrape doesn't gate /health.
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 16
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
      volumes:
        - name: ravendb-client-cert
          secret:
            secretName: ravendb-client-cert
        - name: ravendb-ca-cert
          secret:
            secretName: ravendb-ca-cert
