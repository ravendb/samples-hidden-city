name: k8s-nightly

# Non-blocking early warning: re-resolves each dependency's latest TAGGED
# release (never a moving branch ref -- that's the exact bug versions.env
# exists to fix) and runs k8s/start-k8s.sh against those instead of the
# pinned versions.env. A failure here means "bumping to today's latest release
# of each dependency would break the stack" -- surfaced before anyone does
# that bump manually, not a return to tracking master/main.
#
# NOT re-resolved -- these are literal pins baked into static YAML/Dockerfile
# per versions.env's design (kept human-readable/standalone-applyable, not
# templated from VERSIONS_FILE), so bumping them here wouldn't actually change
# what the cluster runs: KIND_NODE_IMAGE, RAVENDB_IMAGE_TAG, PYTHON_IMAGE_TAG,
# UV_VERSION. Also not re-resolved: INGRESS_NGINX_VERSION (upstream archived
# 2026-03-24, nothing new to resolve), CERT_MANAGER_VERSION and
# OPENSSL_VERSION (Windows-only / not part of this effort's moving-ref list).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

jobs:
  latest-upstream:
    name: Smoke test against latest upstream releases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      OPENAI_API_KEY: sk-ci-placeholder-not-a-real-key
      TRAVELPAYOUTS_TOKEN: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write RavenDB license
        env:
          RAVENDB_LICENSE: ${{ secrets.RAVENDB_LICENSE }}
        run: printf '%s' "$RAVENDB_LICENSE" > license.json

      - name: Resolve latest upstream releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source versions.env

          latest_gh_release() {
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$1/releases/latest" | jq -r .tag_name
          }
          # Helm 4 exists but the user deliberately pinned the 3.x line (v3
          # still gets security fixes) -- nightly tracks that same line, it
          # doesn't silently jump major versions.
          latest_gh_release_v3() {
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$1/releases?per_page=30" \
              | jq -r '[.[] | select(.tag_name | startswith("v3."))][0].tag_name'
          }
          # Reads the chart's own published Helm repo index directly -- NOT
          # Artifact Hub's API, which was confirmed to report a chart version
          # (ravendb-cluster 2.1.0) that doesn't actually exist in this repo's
          # index (real latest was 1.0.0), breaking `helm upgrade --install
          # --version` outright. The index lists versions newest-first per
          # chart, so the first `version:` line under a chart's 2-space-indent
          # key is the latest.
          latest_chart_version() {
            curl -fsSL https://ravendb.github.io/ravendb-operator/helm/index.yaml | awk -v key="  ${1}:" '
              $0 == key { infield=1; next }
              infield && /^  [A-Za-z]/ { infield=0 }
              infield && /^    version: / { print $2; exit }
            '
          }

          NEW_CALICO_VERSION=$(latest_gh_release projectcalico/calico)
          NEW_KIND_VERSION=$(latest_gh_release kubernetes-sigs/kind)
          NEW_KUBECTL_VERSION=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
          NEW_HELM_VERSION=$(latest_gh_release_v3 helm/helm)
          NEW_RAVENDB_OPERATOR_CHART_VERSION=$(latest_chart_version ravendb-operator)
          NEW_RAVENDB_CLUSTER_CHART_VERSION=$(latest_chart_version ravendb-cluster)

          {
            echo "CALICO_VERSION=$NEW_CALICO_VERSION"
            echo "INGRESS_NGINX_VERSION=$INGRESS_NGINX_VERSION"
            echo "KIND_VERSION=$NEW_KIND_VERSION"
            echo "KIND_NODE_IMAGE=$KIND_NODE_IMAGE"
            echo "KUBECTL_VERSION=$NEW_KUBECTL_VERSION"
            echo "HELM_VERSION=$NEW_HELM_VERSION"
            echo "OPENSSL_VERSION=$OPENSSL_VERSION"
            echo "CERT_MANAGER_VERSION=$CERT_MANAGER_VERSION"
            echo "RAVENDB_OPERATOR_CHART_VERSION=$NEW_RAVENDB_OPERATOR_CHART_VERSION"
            echo "RAVENDB_CLUSTER_CHART_VERSION=$NEW_RAVENDB_CLUSTER_CHART_VERSION"
            echo "RAVENDB_IMAGE_TAG=$RAVENDB_IMAGE_TAG"
            echo "PYTHON_IMAGE_TAG=$PYTHON_IMAGE_TAG"
            echo "UV_VERSION=$UV_VERSION"
          } > versions.nightly.env

          {
            echo "### Nightly vs pinned versions.env"
            echo ""
            echo "| Component | Pinned | Latest resolved |"
            echo "|---|---|---|"
            echo "| Calico | $CALICO_VERSION | $NEW_CALICO_VERSION |"
            echo "| kind | $KIND_VERSION | $NEW_KIND_VERSION |"
            echo "| kubectl | $KUBECTL_VERSION | $NEW_KUBECTL_VERSION |"
            echo "| helm (3.x) | $HELM_VERSION | $NEW_HELM_VERSION |"
            echo "| ravendb-operator chart | $RAVENDB_OPERATOR_CHART_VERSION | $NEW_RAVENDB_OPERATOR_CHART_VERSION |"
            echo "| ravendb-cluster chart | $RAVENDB_CLUSTER_CHART_VERSION | $NEW_RAVENDB_CLUSTER_CHART_VERSION |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run k8s/start-k8s.sh (latest upstream releases)
        env:
          VERSIONS_FILE: ${{ github.workspace }}/versions.nightly.env
        run: bash k8s/start-k8s.sh --no-wait

      - name: Cluster state (on failure)
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl describe ravendbcluster ravendb-cluster -n hidden-city || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -100 || true

      - name: Report outcome
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ Latest upstream releases still work -- nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Latest upstream releases broke the stack -- review before bumping versions.env." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name hidden-city || true
